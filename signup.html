<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - GlamMate</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- Body and Overall Background --- */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Gradient background to mimic the image's overall color */
            background: linear-gradient(135deg, #ffcdd2 0%, #f06292 100%); 
            overflow: hidden; 
        }

        /* --- Main Login Card Container --- */
        .signup-card { /* Changed class name to signup-card */
            display: flex;
            width: 700px; /* Overall card width */
            height: 450px; /* Overall card height */
            border-radius: 30px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2); 
            overflow: hidden; 
            backdrop-filter: blur(10px); /* Frosted effect on the whole card */
            background-color: rgba(255, 255, 255, 0.1); 
        }

        /* --- Left Image Panel (The 'Scenery' Panel) --- */
        .image-panel {
            flex: 1; 
            position: relative;
            /* Using the makeup kit image for the theme */
            background-image: url('images/Kit Profissional de Maquiagem_ Tudo o Que Você Precisa em Um Só Lugar!.jpeg');
            background-size: cover;
            background-position: center;
            /* Subtle overlay to help blend the image into the pink theme */
            box-shadow: inset 0 0 0 1000px rgba(255, 224, 224, 0.2);
        }

        /* --- Right Form Panel (The 'Login' Panel) --- */
        .form-panel {
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            /* Background for the right panel: Frosted/Glassy pink */
            background-color: rgba(255, 204, 204, 0.5); 
            backdrop-filter: blur(20px); /* Stronger blur for the form panel */
            border-left: 1px solid rgba(255, 255, 255, 0.3); 
        }

        /* --- Text Styling --- */
        h2 {
            font-size: 32px;
            font-weight: 500;
            color: #880e4f; /* Deep pink for heading */
            margin-bottom: 40px;
            text-align: center;
        }

        /* --- Input Fields Container (for flex layout) --- */
        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        /* --- Input Field Styling --- */
        input {
            width: 100%;
            padding: 10px 0; 
            border: none;
            border-bottom: 1px solid rgba(136, 14, 79, 0.5); 
            background: transparent; 
            font-size: 16px;
            color: #880e4f; 
            outline: none;
            transition: border-bottom 0.3s ease;
        }

        /* Placeholder style */
        input::placeholder {
            color: #880e4f; 
            opacity: 0.7;
        }

        input:focus {
            border-bottom: 2px solid #880e4f; 
        }

        /* --- Labels and Icons Positioning --- */
        label {
            position: absolute;
            top: -20px; 
            left: 0;
            font-size: 14px;
            color: #880e4f;
            pointer-events: none;
        }

        .icon {
            position: absolute;
            top: 10px;
            right: 0;
            color: #880e4f;
            font-size: 18px;
        }
        
        /* Button Style (Neumorphism) */
        .submit-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 25px; 
            margin-top: 10px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            
            background: linear-gradient(145deg, #ffcdd2, #e57373);
            color: #880e4f; 
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1), -5px -5px 10px rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease-in-out;
        }

        .submit-button:hover {
            box-shadow: inset 3px 3px 5px rgba(0, 0, 0, 0.2), inset -3px -3px 5px rgba(255, 255, 255, 0.7);
            background: linear-gradient(145deg, #e57373, #ffcdd2);
        }

        /* --- Footer Links Container --- */
        .footer-links {
            display: flex;
            justify-content: center; /* Center the single link */
            margin-top: 30px;
            font-size: 14px;
        }

        .footer-links a {
            color: #880e4f;
            text-decoration: none;
            font-weight: 500;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .footer-links a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .fa {
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            font-style: normal;
        }

    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="signup-card">
        <div class="image-panel">
            </div>

        <div class="form-panel">
            <h2>Create Account</h2>
            <form action="#">
                
                <div class="input-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" placeholder="" required />
                    <i class="fas fa-envelope icon"></i>
                </div>

                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="" required />
                    <i class="fas fa-lock icon"></i>
                </div>
                
                <div class="input-group"> 
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="" required />
                    <i class="fas fa-lock icon"></i>
                </div>


                <button type="submit" class="submit-button" id="signupBtn">Sign Up</button>
            </form>

            <div class="footer-links">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </div>

    <script type="module">
        // **IMPORTANT:** Ensure your 'firebase.js' file is in the same directory and contains your config.
        import { auth } from './firebase.js'; 
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        document.getElementById('signupBtn').addEventListener('click', async (e) => {
            e.preventDefault(); 
            
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Basic validation
            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }
            if (password.length < 6) {
                 alert("Password must be at least 6 characters long.");
                 return;
            }

            try {
                // Creates the user account in Firebase Authentication
                await createUserWithEmailAndPassword(auth, email, password);
                
                alert('Account created successfully! You can now log in.');
                // Redirects to the login page after successful registration
                window.location.href = 'login.html'; 
                
            } catch (error) {
                // Handles errors like 'email-already-in-use'
                alert(error.message);
            }
        });
    </script>
</body>
</html>
